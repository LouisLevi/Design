# Netlify: veröffentlicht die Website aus dem Ordner planungsbuero-guenther.
# Die Seiten sind fertig erzeugt im Repo (python3 _src/build.py) – Netlify muss nichts bauen.
[build]
  base = "planungsbuero-guenther"
  publish = "."
  command = ""

# Arbeitsdateien nicht öffentlich ausliefern
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/entwurf/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Alte Wix-Adresse ohne www → mit www (Domain wird später verbunden)
[[redirects]]
  from = "https://planungsbuero-guenther.de/*"
  to = "https://www.planungsbuero-guenther.de/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
